name: release

# Push a tag to publish binaries to GitHub Releases:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:  # manual fallback: Actions tab -> release -> Run workflow
    inputs:
      version:
        description: "Version (e.g. v0.0.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Build release archives
        run: make release VERSION=${{ inputs.version || github.ref_name }}

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
